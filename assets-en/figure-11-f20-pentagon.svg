<svg xmlns="http://www.w3.org/2000/svg" width="980" height="660" viewBox="0 0 980 660" role="img" aria-label="Figure 11: The Pentagon Picture of F20">
  <rect width="100%" height="100%" fill="#fbfcfa"/>
  <defs>
    <marker id="arrow" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto">
      <path d="M1,1 L4.5,2.5 L1,4 Z" fill="#2e6f65"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#12332f" flood-opacity="0.10"/>
    </filter>
  </defs>

  <text x="490" y="54" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="30" font-weight="700" fill="#183f3a" text-anchor="middle">Figure 11: The Pentagon Picture of F20</text>
  <rect x="45" y="90" width="890" height="500" rx="14" fill="#fbfdfb" stroke="#c9ddd6" stroke-width="2"/>

  <text x="310" y="130" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="23" font-weight="700" fill="#183f3a" text-anchor="middle">Arrange the five roots as a pentagon</text>
  <text x="310" y="555" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="17" fill="#63736f" text-anchor="middle">Labels 1-5 are a visual relabeling of the five elements of F5</text>

  <line x1="310" y1="168" x2="310" y2="510" stroke="#e28b38" stroke-width="3" opacity="0.82" stroke-linecap="round"/>
  <line x1="104" y1="260" x2="516" y2="386" stroke="#8a9a28" stroke-width="3" opacity="0.86" stroke-linecap="round"/>
  <line x1="516" y1="260" x2="104" y2="386" stroke="#239e36" stroke-width="3" opacity="0.86" stroke-linecap="round"/>
  <line x1="196" y1="506" x2="382" y2="170" stroke="#e77436" stroke-width="3" opacity="0.82" stroke-linecap="round"/>
  <line x1="424" y1="506" x2="238" y2="170" stroke="#e7c22c" stroke-width="3" opacity="0.82" stroke-linecap="round"/>

  <polygon points="310,173 452,277 398,444 222,444 168,277" fill="#ffffff" stroke="#111111" stroke-width="5" stroke-linejoin="round"/>
  <circle cx="310" cy="323" r="8" fill="#2e6f65"/>
  <path d="M230 223 C285 178, 372 182, 421 237" fill="none" stroke="#2e6f65" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
  <text x="326" y="221" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="18" font-weight="700" fill="#2e6f65" text-anchor="middle">rotation</text>

  <text x="148" y="272" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="20" font-weight="700" fill="#b85c5c" text-anchor="middle">1</text>
  <text x="310" y="163" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="20" font-weight="700" fill="#b85c5c" text-anchor="middle">2</text>
  <text x="473" y="272" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="20" font-weight="700" fill="#b85c5c" text-anchor="middle">3</text>
  <text x="410" y="480" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="20" font-weight="700" fill="#b85c5c" text-anchor="middle">4</text>
  <text x="210" y="480" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="20" font-weight="700" fill="#b85c5c" text-anchor="middle">5</text>

  <rect x="585" y="130" width="305" height="90" rx="11" fill="#fffaf0" stroke="#e2d5ae" stroke-width="2"/>
  <text x="612" y="164" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="23" font-weight="700" fill="#caa94b">5 rotations</text>
  <text x="612" y="195" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="19" fill="#183f3a">x ↦ x + b</text>
  <text x="774" y="195" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="19" fill="#2e6f65">(1 2 3 4 5)</text>

  <rect x="585" y="245" width="305" height="95" rx="11" fill="#eff8f4" stroke="#c9ddd6" stroke-width="2"/>
  <text x="612" y="280" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="23" font-weight="700" fill="#2e6f65">5 reflections</text>
  <text x="612" y="311" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="19" fill="#183f3a">x ↦ -x + b</text>
  <text x="750" y="311" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="19" fill="#2e6f65">e.g. (2 5)(3 4)</text>

  <rect x="585" y="365" width="305" height="105" rx="11" fill="#eef3fa" stroke="#c8d6e8" stroke-width="2"/>
  <text x="612" y="401" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="23" font-weight="700" fill="#5d83b3">10 extra affine maps</text>
  <text x="612" y="433" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="19" fill="#183f3a">a = 2 or 3</text>
  <text x="750" y="433" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="19" fill="#2e6f65">e.g. τ=(2 3 5 4)</text>

  <rect x="145" y="602" width="690" height="46" rx="12" fill="#eef6f3" stroke="#c9ddd6" stroke-width="2"/>
  <text x="315" y="633" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="25" font-weight="700" fill="#183f3a" text-anchor="middle">5 + 5 + 10 = 20</text>
  <text x="605" y="633" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="23" font-weight="700" fill="#183f3a" text-anchor="middle">F20 ≅ AGL(1,5) ≅ C5 ⋊ C4</text>
</svg>
